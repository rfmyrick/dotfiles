set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b  # change the Prefix key from C-b to C-Space
set -g prefix C-Space
bind C-Space send-prefix

unbind %  # change split vertical to | and set to the directoy of the current pane
bind | split-window -h -c "#{pane_current_path}"

unbind '"'  # change split horizontal to - and set to the directory of the current pane 
bind - split-window -v -c "#{pane_current_path}"

unbind r  # set Prefix-r to reload the tmux configuration
bind r source-file ~/.config/tmux/tmux.conf

# Vim style keys for pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Vim style keys to resize panes
#bind h resize-pane -L 5
#bind j resize-pane -D 5
#bind k resize-pane -U 5
#bind l resize-pane -R 5

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

bind -r m resize-pane -Z # toggle zooming in and out of the current pane

set -sg escape-time 10  # reduce the delay for processing the ESC key from 500ms to 10ms making vim/nvim feel more responsive

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux' # a zen color theme
#set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
